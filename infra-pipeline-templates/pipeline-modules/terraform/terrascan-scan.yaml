parameters:
  - name: tfExecutionDir
    type: string
    default: ''

steps:
  - script: |
      apt-get update
      apt-get install -y wget
      wget https://github.com/tenable/terrascan/releases/download/v1.19.0/terrascan_1.19.0_Linux_x86_64.tar.gz
      tar -xzf terrascan_1.19.0_Linux_x86_64.tar.gz
      sudo mv terrascan /usr/local/bin/
      terrascan version
    displayName: Install Terrascan
    continueOnError: false

  - script: |
      terrascan scan -d $(pwd) -o junit-xml > $(pwd)/TerrascanReport.xml
    continueOnError: true
    displayName: Run Terrascan
    workingDirectory: '${{ parameters.tfExecutionDir }}'

  - task: PublishTestResults@2
    displayName: Publish Terrascan Results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '**/*TerrascanReport.xml'
      searchFolder: '${{ parameters.tfExecutionDir }}'
      mergeTestResults: true
      failTaskOnFailedTests: true
      testRunTitle: Terrascan Scan Results
      publishRunAttachments: true
