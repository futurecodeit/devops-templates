parameters:
  - name: tfExecutionDir
    type: string
    default: ''

steps:
  - script: |
      sudo apt-get update
      sudo apt-get install -y wget
      LATEST_VERSION=$(curl -s https://api.github.com/repos/tenable/terrascan/releases/latest | grep tag_name | cut -d '"' -f 4)
      echo "Installing Terrascan version: $LATEST_VERSION"
      wget https://github.com/tenable/terrascan/releases/download/$LATEST_VERSION/terrascan_$(echo $LATEST_VERSION | cut -d 'v' -f 2)_Linux_x86_64.tar.gz
      tar -xzf terrascan_*.tar.gz
      sudo mv terrascan /usr/local/bin/
      terrascan version
    displayName: Install Terrascan
    continueOnError: false

  - script: |
      terrascan scan -d . -o json > TerrascanReport.json 2>&1
      SCAN_EXIT_CODE=$?
      echo "Terrascan exit code: $SCAN_EXIT_CODE"
      if [ $SCAN_EXIT_CODE -ne 0 ] && [ $SCAN_EXIT_CODE -ne 3 ]; then
        cat TerrascanReport.json
        exit $SCAN_EXIT_CODE
      fi
    continueOnError: true
    displayName: Run Terrascan
    workingDirectory: '${{ parameters.tfExecutionDir }}'

  - script: |
      python3 << 'EOF'
      import json
      import xml.etree.ElementTree as ET
      
      with open('TerrascanReport.json', 'r') as f:
          data = json.load(f)
      
      # Convert JSON to JUnit XML format
      testsuites = ET.Element('testsuites')
      testsuite = ET.SubElement(testsuites, 'testsuite', name='Terrascan', tests=str(len(data.get('results', []))))
      
      for violation in data.get('results', []):
          testcase = ET.SubElement(testsuite, 'testcase', name=violation.get('rule_id', 'unknown'))
          if violation.get('severity') == 'HIGH' or violation.get('severity') == 'CRITICAL':
              failure = ET.SubElement(testcase, 'failure', message=violation.get('description', ''))
              failure.text = f"File: {violation.get('file_path', '')}\nLine: {violation.get('line', '')}"
      
      tree = ET.ElementTree(testsuites)
      tree.write('TerrascanReport.xml')
      print("Converted to JUnit XML format")
      EOF
    displayName: Convert Terrascan Report to JUnit XML
    continueOnError: true
    workingDirectory: '${{ parameters.tfExecutionDir }}'

  - task: PublishTestResults@2
    displayName: Publish Terrascan Results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '**/*TerrascanReport.xml'
      searchFolder: '${{ parameters.tfExecutionDir }}'
      mergeTestResults: true
      failTaskOnFailedTests: true
      testRunTitle: Terrascan Scan Results
      publishRunAttachments: true
